<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Student Support - Home</title>

    <!-- Icon, an actual icon file (16x16 or 32x32). -->
    <link rel="icon" href="icon.ico" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/main.css" />

    <!-- Load bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  </head>

  <body>
    <header class="site-header">
      <div class="branding">
        <!-- Could be an <img> logo, an <h1>, or both -->
          <a href="/" class="site-logo">
            <img src="img/logo.svg" alt="Metropolitan Rural University logo" />
          </a>

          <p class="tagline">MRU University Tagline</p>
      </div>

      <nav class="site-nav">
        <ul>
          <li><a href="">Home</a></li>
          <li><a href="">Pomodoro Timer</a></li>
          <li><a href="">Mathematics Dept</a></li>
          <li><a href="">English Dept</a></li>
          <li><a href="">Computer Science Dept</a></li>
          <li><a href="">History Dept</a></li>
          <!-- Add more links as needed -->
        </ul>
      </nav>
    </header>

    <!-- Main Content Area -->
    <main id="main-content">

      <!-- Header section -->
      <section>
        <header>
          <h1>Welcome to MRU University's Support Site!</h1>
        </header>
      </section>

      <!-- Begin Photo Carousel: -->
      <section>
        <div class="container-fluid">
          <div id="carouselIndicators" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-indicators">
              <button type="button" data-bs-target="#carouselIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
              <button type="button" data-bs-target="#carouselIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
              <button type="button" data-bs-target="#carouselIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>

            <div class="carousel-inner">
              <div class="carousel-item active">
                <img class="d-block w-100 carousel-img" src="img/index/temp_carousel_1.jpg" alt="First slide">
              </div>
              <div class="carousel-item">
                <img class="d-block w-100 carousel-img" src="img/index/temp_carousel_2.jpg" alt="Second slide">
              </div>
              <div class="carousel-item">
                <img class="d-block w-100 carousel-img" src="img/index/temp_carousel_3.jpg" alt="Third slide">
              </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselIndicators" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#carouselIndicators" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
        </div>
      </section>
      <!-- End Photo Carousel -->

    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <nav class="footer-nav" aria-label="Footer">
        <ul>
          <li><a href="">Not-so-provate Privacy Statement</a></li>
          <li><a href="">Terms of Service</a></li>
          <li><a href="">Nonexistent Sitemap</a></li>
        </ul>
      </nav>

      <p class="copyright">
        <small><span id="year"></span> MRU University. All rights reserved.</small>
      </p>
    </footer>

    <!-- Connect to your script file here -->
    <script src = "../js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
