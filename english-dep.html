<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Page Title</title>

    <!-- Icon, an actual icon file (16x16 or 32x32). -->
    <link rel="icon" href="icon.ico" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/main.css" />

    <!-- Load bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  </head>

  <body>
    <header class="site-header">
      <div class="branding">
        <!-- Could be an <img> logo, an <h1>, or both -->
          <a href="/" class="site-logo">
            <img src="img/logo.svg" alt="Site Name logo" />
          </a>

          <p class="tagline">A short site tagline or mission statement.</p>
      </div>

      <nav class="site-nav">
        <ul>
          <li><a href="">Home</a></li>
          <li><a href="">link1</a></li>
          <li><a href="">link2</a></li>
          <li><a href="">link3</a></li>
          <!-- Add more links as needed -->
        </ul>
      </nav>
    </header>

    <!-- Main Content Area -->
    <main id="main-content">
      <section>
        <header>
          <h1>Welcome to my site!</h1>
        </header>

        <p>
          <!-- Some stuff... -->
        </p>
      </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <nav class="footer-nav" aria-label="Footer">
        <ul>
          <li><a href="">Privacy</a></li>
          <li><a href="">Terms of Service</a></li>
          <li><a href="">Sitemap</a></li>
        </ul>
      </nav>

      <p class="copyright">
        <small>© <span id="year"></span> Your Site. All rights reserved.</small>
      </p>
    </footer>

    <!-- Connect to your script file here -->
    <script src = "../js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
